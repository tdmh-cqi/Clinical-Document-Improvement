<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMSH - Clinical Documents Improvement Audit Checklist</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
        
        .checklist-group { background-color: #1e3a8a; color: white; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        .score-pass { background-color: #dcfce7; color: #166534; border-color: #166534; }
        .score-query { background-color: #fef08a; color: #854d0e; border-color: #854d0e; }
        .score-rth { background-color: #fee2e2; color: #991b1b; border-color: #991b1b; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center z-[100] transition-opacity duration-300 px-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full flex flex-col items-center">
            <div class="bg-blue-100 p-4 rounded-full text-blue-800 mb-4">
                <i class="fa-solid fa-user-shield text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">CDI Audit App 2026</h2>
            <p class="text-sm text-slate-500 mb-6 text-center">Login with your credentials.</p>
            <form id="loginForm" class="w-full flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" id="appUsername" placeholder="Enter username" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" id="appPassword" placeholder="Enter password" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-3">
                    <p id="loginError" class="text-red-500 text-xs font-semibold mt-2 text-center hidden">Incorrect credentials.</p>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-800 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-900 transition-colors mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In to System
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="mainAppWrapper" class="hidden flex-col min-h-screen w-full">
        <!-- Header -->
        <header class="bg-blue-800 text-white shadow-md relative z-10">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-2 rounded-lg shadow-sm hidden sm:block"><i class="fa-solid fa-hospital-user text-blue-800 text-xl"></i></div>
                    <div>
                        <h1 class="text-xl font-bold leading-tight">Taytay Doctors Multispecialty Hospital</h1>
                        <p class="text-blue-200 text-xs font-medium uppercase tracking-wider">Clinical Documents Improvement (CDI)</p>
                    </div>
                </div>
                <div class="text-sm font-medium text-blue-200 bg-blue-900 px-3 py-1.5 rounded-full">
                    <i class="fa-solid fa-user text-xs mr-1"></i> <span id="displayUsername" class="text-white font-bold tracking-wider"></span>
                </div>
            </div>
            <div class="bg-slate-50 px-4 sm:px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h2 id="formHeaderTitle" class="text-lg font-semibold text-slate-800"><i class="fa-solid fa-file-medical text-blue-600 mr-2"></i>New Comprehensive CDI Audit</h2>
                <div id="liveScoreBadge" class="hidden px-3 py-1 rounded-full text-xs sm:text-sm font-bold border"></div>
            </div>
        </header>

        <main class="flex-grow p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full flex flex-col gap-6 sm:gap-8 overflow-x-hidden">
            <form id="auditForm" class="flex flex-col gap-6">
                <!-- Patient Demographics & Info -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 font-semibold text-slate-700">Patient Details</div>
                    <div class="p-4 sm:p-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="col-span-1 md:col-span-2 lg:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Patient Name</label>
                            <input type="text" id="patientName" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Age</label>
                            <input type="number" id="age" required min="0" class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date of Admission</label>
                            <input type="date" id="dateAdmission" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                        </div>
                        <div class="col-span-1 md:col-span-2 lg:col-span-4">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Chief Complaint</label>
                            <input type="text" id="chiefComplaint" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                        </div>
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Admitting Diagnosis</label>
                            <textarea id="admittingDiagnosis" required rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"></textarea>
                        </div>
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Final Diagnosis</label>
                            <textarea id="finalDiagnosis" rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2" placeholder="Leave blank if not yet discharged"></textarea>
                        </div>
                        <div class="col-span-1 lg:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date of Discharge</label>
                            <input type="date" id="dateDischarge" class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                        </div>
                    </div>
                </div>

                <!-- Checklist Table -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col w-full max-w-full">
                    <div class="table-container overflow-x-auto w-full">
                        <table class="w-full text-sm text-left whitespace-nowrap sm:whitespace-normal">
                            <thead class="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="px-3 py-3 w-12 text-center">#</th>
                                    <th class="px-4 py-3 min-w-[250px]">AUDIT ITEM</th>
                                    <th class="px-4 py-3 w-32 text-center">ANSWER</th>
                                    <th class="px-4 py-3 w-20 text-center">SCORE</th>
                                    <th class="px-4 py-3 min-w-[180px]">AUTO ACTION</th>
                                </tr>
                            </thead>
                            <tbody id="checklistBody" class="divide-y divide-slate-200"></tbody>
                            <tfoot class="bg-slate-50 border-t-2 border-slate-300">
                                <tr>
                                    <td colspan="3" class="px-4 py-3 text-right font-bold text-slate-700">TOTAL SCORE</td>
                                    <td class="px-4 py-3 text-center font-bold text-lg text-blue-700" id="totalScoreDisplay">0</td>
                                    <td class="px-4 py-3 text-sm text-slate-500">/ 2
